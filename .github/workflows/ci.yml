name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -q ruff bandit pytest pytest-asyncio httpx build twine
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r rwa_xray_editor -x rwa_xray_editor/vendor -ll
      - name: Tests (incl. embedded JS via node --check)
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Twine check
        run: twine check dist/*
      - name: Wheel contents and sha256
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for required in ("rwa_xray_editor/vendor/cm.js", "rwa_xray_editor/vendor/CODEMIRROR-LICENSE.txt"):
              assert required in names, required
          assert any(n.endswith("licenses/LICENSE") for n in names)
          assert any(n.endswith("licenses/NOTICE.md") for n in names)
          print("\n".join(names))
          EOF
          sha256sum dist/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: wheel
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: sha256
        run: sha256sum dist/*.whl | tee dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
          generate_release_notes: true
